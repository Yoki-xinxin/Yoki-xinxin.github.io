<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131" role="img" aria-labelledby="title desc">
  <title id="title">Guancha AI Product Manager Bootcamp Certificate of Completion</title>
  <desc id="desc">English translation of Yuxin Chen's certificate of completion for the Guancha AI Product Manager Bootcamp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b35"/>
      <stop offset="1" stop-color="#0d3f6e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19d6a4"/>
      <stop offset="1" stop-color="#4f8df7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1131" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="1015" rx="44" fill="#f9fcff" stroke="#2c6fb7" stroke-width="5"/>
  <rect x="86" y="86" width="1428" height="959" rx="30" fill="none" stroke="#bcd7ef" stroke-width="2"/>

  <text x="800" y="165" text-anchor="middle" fill="#0d63b0" font-family="Times New Roman, serif" font-size="40" font-weight="700" letter-spacing="10">GUANCHA</text>
  <text x="800" y="238" text-anchor="middle" fill="#0b2a4a" font-family="Times New Roman, serif" font-size="54" font-weight="700" letter-spacing="2">AI PRODUCT MANAGER BOOTCAMP</text>
  <rect x="365" y="275" width="870" height="6" rx="3" fill="url(#line)"/>

  <text x="800" y="400" text-anchor="middle" fill="#0d63b0" font-family="Times New Roman, serif" font-size="84" font-weight="700" letter-spacing="1">CERTIFICATE OF COMPLETION</text>

  <text x="800" y="545" text-anchor="middle" fill="#0b2a4a" font-family="Times New Roman, serif" font-size="38" font-weight="700">This certificate is awarded to</text>
  <text x="800" y="650" text-anchor="middle" fill="#0b2a4a" font-family="Times New Roman, serif" font-size="88" font-weight="700" letter-spacing="3">YUXIN CHEN</text>

  <text x="800" y="735" text-anchor="middle" fill="#29445f" font-family="Times New Roman, serif" font-size="29">
    for successfully completing the Guancha AI Product Manager Bootcamp in 2026,
  </text>
  <text x="800" y="778" text-anchor="middle" fill="#29445f" font-family="Times New Roman, serif" font-size="29">
    actively participating in the programme and completing the required product tasks.
  </text>
  <text x="800" y="845" text-anchor="middle" fill="#29445f" font-family="Times New Roman, serif" font-size="26">
    We hope the knowledge and inspiration from this summer continue to shape your work in AI products.
  </text>

  <text x="800" y="975" text-anchor="middle" fill="#0b2a4a" font-family="Times New Roman, serif" font-size="34" font-weight="700">GUANCHA</text>
  <text x="800" y="1018" text-anchor="middle" fill="#5a7187" font-family="Times New Roman, serif" font-size="24">July 2026 · watcha.cn</text>

  <g fill="#f4c542">
    <path d="M160 220l11 23 25 4-18 18 4 25-22-12-22 12 4-25-18-18 25-4z"/>
    <path d="M1420 190l10 21 23 3-17 16 4 23-20-11-21 11 4-23-16-16 23-3z"/>
    <path d="M210 830l9 19 21 3-15 15 3 21-18-10-19 10 4-21-15-15 21-3z"/>
    <path d="M1375 865l9 19 21 3-15 15 3 21-18-10-19 10 4-21-15-15 21-3z"/>
  </g>
</svg>
